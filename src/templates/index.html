<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@32,400,0,0" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><span class="material-symbols-rounded">folder_open</span><span>Tài liệu</span><button id="toggle-sidebar-btn" class="material-symbols-rounded" title="Thu gọn" aria-label="Thu gọn">chevron_left</button></div>
            <form id="document-upload-form" class="document-upload-form">
                <label class="sr-only" for="document-file-input">Chọn tài liệu</label>
                <input id="document-file-input" name="file" type="file" accept=".pdf,.doc,.docx,.docm,.odt,.rtf,.pages,.ppt,.pptx,.pptm,.odp,.key,.xls,.xlsx,.xlsm,.ods,.csv,.tsv,.numbers,.jpg,.jpeg,.png,.gif,.bmp,.tiff,.webp,.svg" required />
                <button id="upload-document-btn" type="submit" class="material-symbols-rounded" title="Tải tài liệu lên" aria-label="Tải tài liệu lên">upload_file</button>
            </form>
            <div class="documents-list" id="documents-list" aria-live="polite"></div>
        </aside>
        <main class="main-content">
            <header class="session-bar">
                <button id="new-session-btn" type="button" class="material-symbols-rounded" title="Cuộc trò chuyện mới" aria-label="Cuộc trò chuyện mới">add_comment</button>
                <ul id="sessions-list" class="sessions-list" aria-label="Cuộc trò chuyện"></ul>
                <button id="rename-session-btn" type="button" class="material-symbols-rounded" title="Đổi tên cuộc trò chuyện" aria-label="Đổi tên cuộc trò chuyện">edit</button>
                <button id="delete-session-btn" type="button" class="material-symbols-rounded" title="Xóa cuộc trò chuyện" aria-label="Xóa cuộc trò chuyện">delete</button>
                <button id="theme-toggle-btn" type="button" class="material-symbols-rounded" title="Đổi giao diện" aria-label="Đổi giao diện">light_mode</button>
            </header>
            <div class="container"><div class="chats-container" aria-live="polite"></div></div>
            <div class="prompt-container"><div class="prompt-wrapper"><form id="prompt-form" class="prompt-form"><input type="text" placeholder="Nhập tin nhắn..." id="prompt-input" class="prompt-input" maxlength="12000" required /><div class="prompt-actions"><button id="stop-response-btn" type="button" class="material-symbols-rounded" title="Dừng xử lý" aria-label="Dừng xử lý">stop_circle</button><button id="send-prompt-btn" class="material-symbols-rounded" title="Gửi tin nhắn" aria-label="Gửi tin nhắn">arrow_upward</button></div></form></div></div>
        </main>
    </div>
    <script type="module" src="/static/script.js"></script>
</body>
</html>
